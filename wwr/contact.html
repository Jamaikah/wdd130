<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Wildwater Expeditions</title>
    <meta name="description" content="Contact Adventure Rafting for trip reservations, questions, and more information about our rafting adventures. 
      We're here to help you plan your next adventure.">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr-logo.png" alt="White Water Rafting Site Logo">
        <nav>
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="about.html">About Us</a>
                </li>
                <li>
                    <a href="trips.html">Trips</a>
                </li>
                <li>
                    <a href="contact.html">Contact Us</a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Wildwater Expeditions</h1>
        <p>Cagayan de Oro River</p>
        <p>Cagayan de Oro, Philippines</p>
        <p>+639224568019</p>
        <p>wildwater@wwr.com</p>

        <div class="form-container">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d8887.367048745753!2d124.61330749151031!3d8.383854313685996!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1slumbia%20water%20rafting!5e1!3m2!1sen!2sph!4v1785597246761!5m2!1sen!2sph"
                  width="350" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form>
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="John Smith">
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" placeholder="john.smith@email.com">
                </div>
                <div class="radio-section">
                    <label for="purpose">Message Purpose</label>
                    <label>
                        <input type="radio" id="general" name="purpose"
                          value="general inquiry">General Inquiry
                    </label>

                    <label>
                        <input type="radio" id="reservation" name="purpose"
                          value="reservation question">Reservation
                        Question
                    </label>
                    <label>
                        <input type="radio" id="website" name="purpose"
                          value="website suggestion">Website
                        Suggestion
                    </label>
                </div>
                <div>
                    <label for="message">Message</label>
                    <textarea name="message" id="message" rows="4"
                      placeholder="Type here"></textarea>
                </div>
                <div>
                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter">Please subscribe
                        me to the monthly newsletter</label>
                </div>
                <div>
                    <button type="submit">Get in Touch!</button>
                </div>
            </form>
        </div>

        <fieldset>
            <h2>We Are Here To Serve You</h2>
            <section class="employees">
                <figure>
                    <img src=" images/employee_profile.webp" alt="Employee Profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee_profile.webp" alt="Employee Profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee_profile.webp" alt="Employee Profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </section>
        </fieldset>
    </main>
    <footer>
        <p>©2026 • Wildwater Expeditions • Haezell Jamaikah Abdul</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/fb-logo.png" alt="Facebook Icon" width="50">
            </a>
            <a href="https://x.com">
                <img src="images/x-logo.png" alt="X Icon" width="50">
            </a>
            <a href="https://instagram.com">
                <img src="images/ig-logo.png" alt="Instagram Icon" width="50">
            </a>
        </nav>
    </footer>

</body>

</html>
